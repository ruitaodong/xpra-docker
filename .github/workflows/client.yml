name: Client image (amd64 + arm64)

on:
  push:
    branches: [main]
    tags: ["*"]
    paths: ["client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Xpra repository channel"
        type: choice
        options: [xpra-lts, xpra, xpra-beta]
        default: xpra-lts
      no_cache:
        description: "Rebuild from scratch (fetch the newest Xpra packages)"
        type: boolean
        default: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-client
  XPRA_CHANNEL: ${{ inputs.channel || 'xpra-lts' }}
  NO_CACHE: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}

jobs:
  # Each architecture builds and is tested on its own native runner (no emulation)
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      xpra: ${{ steps.version.outputs.xpra }}
    steps:
      - name: Prepare
        run: |
          p='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${p//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: client
          platforms: ${{ matrix.platform }}
          load: true
          tags: xpra-client-test:ci
          build-args: XPRA_CHANNEL=${{ env.XPRA_CHANNEL }}
          no-cache: ${{ env.NO_CACHE == 'true' }}
          cache-from: type=gha,scope=client-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=client-${{ env.PLATFORM_PAIR }},mode=max

      - name: Check Xpra client version is 5 or newer
        id: version
        run: |
          out=$(docker run --rm --entrypoint xpra xpra-client-test:ci --version)
          echo "$out"
          ver=$(echo "$out" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          major=${ver%%.*}
          if [ -z "$major" ] || [ "$major" -lt 5 ]; then
            echo "::error::Expected Xpra 5 or newer on ${{ matrix.platform }}, got '$ver'"
            exit 1
          fi
          docker run --rm --entrypoint test xpra-client-test:ci -x /usr/local/bin/xpra-attach
          docker run --rm --entrypoint dbus-run-session xpra-client-test:ci -- true
          echo "xpra=$ver" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push this architecture by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: client
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: XPRA_CHANNEL=${{ env.XPRA_CHANNEL }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=client-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.push.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine both architectures into one multi-arch tag
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ needs.build.outputs.xpra }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=ref,event=branch

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
