name: Build and push Xpra image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly rebuild to pick up new Xpra releases
  workflow_dispatch:
    inputs:
      channel:
        description: "Xpra repository channel"
        type: choice
        options: [xpra, xpra-lts, xpra-beta]
        default: xpra

env:
  # Published to GitHub Container Registry; no extra secrets needed
  IMAGE: ghcr.io/${{ github.repository }}
  XPRA_CHANNEL: ${{ inputs.channel || 'xpra' }}
  # Add linux/arm64 if xpra.org publishes arm64 packages for noble
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: xpra-test:ci
          build-args: XPRA_CHANNEL=${{ env.XPRA_CHANNEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Xpra version is 5 or newer
        id: version
        run: |
          out=$(docker run --rm --entrypoint xpra xpra-test:ci --version)
          echo "$out"
          ver=$(echo "$out" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          major=${ver%%.*}
          if [ -z "$major" ] || [ "$major" -lt 5 ]; then
            echo "::error::Expected Xpra 5 or newer, got '$ver'"
            exit 1
          fi
          echo "xpra=$ver" >> "$GITHUB_OUTPUT"

      - name: Smoke test the server
        run: |
          docker run -d --name xpra-smoke -p 14500:14500 xpra-test:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:14500/; then
              echo "HTML5 client is being served"; ok=1; break
            fi
            sleep 2
          done
          docker logs xpra-smoke
          docker rm -f xpra-smoke
          [ "$ok" = 1 ] || { echo "::error::Server did not come up"; exit 1; }

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.version.outputs.xpra }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=ref,event=pr

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: XPRA_CHANNEL=${{ env.XPRA_CHANNEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
